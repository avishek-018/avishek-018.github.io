projects:
  - title: "ML Knowledge Hub: Agentic Hybrid GraphRAG for ML Project Knowledge"
    summary: >+
      An agentic GraphRAG assistant that answers questions about ML projects,
      models, datasets and evaluations by combining a Neo4j knowledge graph with
      Qdrant semantic search, giving grounded answers with cited sources.

    tech_stack:
      - Python, OpenAI API, Neo4j, Qdrant, Sentence-Transformers
      - Streamlit, MCP, Pydantic, pytest
    links:
      - label: GitHub
        url: https://github.com/avishek-018/MLKnowledgeHub
      - label: Link
        url: https://mlknowledge.streamlit.app
    bullets:
      - A planner–critic–revision agent pipeline converts each question into a
        structured query plan, reaching 96.7% routing accuracy on a 30-query
        benchmark; supports multi-turn chat by rewriting follow-up questions.
      - Deployed as a Streamlit web app and exposed to AI clients through an MCP
        server.
    featured: false
    order: 1
