<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Authorizing…</title>
</head>
<body>
<script>
(function () {
  // Read token from URL hash: #token=...
  const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
  const params = new URLSearchParams(hash);
  const token = params.get("token");

  if (!token) {
    document.body.innerText = "Missing token";
    return;
  }

  // Immediately remove token from the address bar (no history entry)
  history.replaceState(null, "", window.location.pathname);

  const payload = { token, provider: "github", token_type: "bearer" };
  const msg = "authorization:github:success:" + JSON.stringify(payload);

  if (window.opener && !window.opener.closed) {
    const origin = window.location.origin;
    window.opener.postMessage(msg, origin);
    setTimeout(() => window.opener.postMessage(msg, origin), 50);
    setTimeout(() => window.opener.postMessage(msg, origin), 150);
    setTimeout(() => window.close(), 250);
  } else {
    document.body.innerText = "No opener window";
  }
})();
</script>

</body>
</html>
