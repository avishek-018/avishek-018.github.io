backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "publications"
    label: "Publications"
    folder: "_publications"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Authors", name: "authors", widget: "string" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Venue URL", name: "venue_url", widget: "string", required: false }
      - { label: "Paper URL", name: "paper_url", widget: "string", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Journal"
          - "Conference"
